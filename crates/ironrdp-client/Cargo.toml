[package]
name = "ironrdp-client"
version = "0.1.0"
readme = "README.md"
description = "Portable RDP client without GPU acceleration"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "ironrdp-client"

# Not publishing for now.
publish = false

[lib]
doctest = false
test = false

[[bin]]
name = "ironrdp-client"
test = false

[features]
# `openh264` (which enables `egfx`) is on by default so a plain
# `cargo build --release -p ironrdp-client` renders EGFX/H.264 servers
# (e.g. gnome-remote-desktop) out of the box. The classic bitmap/RemoteFX
# path is unaffected: the connector only advertises the Graphics Pipeline
# when `--egfx` is passed AND the feature is compiled in (see config.rs
# `egfx_enabled`). Building without H.264 is still supported via
# `--no-default-features --features rustls`.
#
# Licensing note: `openh264 -> ironrdp-egfx/openh264-bundled` compiles Cisco's
# OpenH264 from source (`openh264/source`). Cisco's royalty-free H.264 patent
# grant only covers Cisco's own *binary* OpenH264 distribution; a from-source
# build falls outside that umbrella, so shipping this default build assumes the
# distributor either holds an H.264/AVC patent license or accepts that risk.
# A patent-clean portable artifact should build `--no-default-features
# --features rustls` (classic bitmap/RFX only, no H.264).
default = ["rustls", "openh264"]
rustls = ["ironrdp-tls/rustls", "tokio-tungstenite/rustls-tls-native-roots", "ironrdp-mstsgu/rustls"]
native-tls = ["ironrdp-tls/native-tls", "tokio-tungstenite/native-tls", "ironrdp-mstsgu/native-tls"]
qoi = ["ironrdp/qoi"]
qoiz = ["ironrdp/qoiz"]
egfx = ["ironrdp-egfx"]
openh264 = ["egfx", "ironrdp-egfx/openh264-bundled"]

[dependencies]
# Protocols
ironrdp = { path = "../ironrdp", version = "0.14", features = [
    "session",
    "input",
    "graphics",
    "dvc",
    "svc",
    "rdpdr",
    "rdpsnd",
    "cliprdr",
    "displaycontrol",
    "connector",
    "echo",
] }
ironrdp-core = { path = "../ironrdp-core", version = "0.1", features = ["alloc"] }
ironrdp-cliprdr-native = { path = "../ironrdp-cliprdr-native", version = "0.5" }
ironrdp-rdpsnd-native = { path = "../ironrdp-rdpsnd-native", version = "0.5" }
ironrdp-tls = { path = "../ironrdp-tls", version = "0.2" }
ironrdp-mstsgu = { path = "../ironrdp-mstsgu" }
ironrdp-tokio = { path = "../ironrdp-tokio", version = "0.8", features = ["reqwest"] }
ironrdp-rdcleanpath.path = "../ironrdp-rdcleanpath"
ironrdp-dvc-pipe-proxy.path = "../ironrdp-dvc-pipe-proxy"
ironrdp-propertyset.path = "../ironrdp-propertyset"
ironrdp-rdpfile.path = "../ironrdp-rdpfile"
ironrdp-cfg.path = "../ironrdp-cfg"
ironrdp-egfx = { path = "../ironrdp-egfx", version = "0.1", optional = true }

# Windowing and rendering
winit = { version = "0.30", features = ["rwh_06"] }
softbuffer = "0.4"
egui = "0.29"
egui-winit = { version = "0.29", default-features = false, features = ["wayland", "x11", "clipboard"] }

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
proc-exit = "2"
inquire = "0.9"

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async, futures
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
tokio-tungstenite = "0.28"
transport = { git = "https://github.com/Devolutions/devolutions-gateway", rev = "06e91dfe82751a6502eaf74b6a99663f06f0236d" }
futures-util = { version = "0.3", features = ["sink"] }
socket2 = "0.6"

# Utils
whoami = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs-next = "2.0"
anyhow = "1"
mimalloc = "0.1"
smallvec = "1.15"
tap = "1"
semver = "1"
raw-window-handle = "0.6"
uuid = { version = "1.21" }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
ironrdp-dvc-com-plugin = { path = "../ironrdp-dvc-com-plugin" }

[lints]
workspace = true
